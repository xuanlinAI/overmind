name: Overmind CI
on: [push, pull_request]

jobs:
  compile:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - name: Compile all modules
        run: |
          FAIL=0
          for f in *.js; do
            node -c "$f" || FAIL=1
          done
          if [ $FAIL -eq 1 ]; then echo "COMPILE FAILED"; exit 1; fi
          echo "All modules compile OK"
      - name: Test platform detection
        run: node -e "const p=require('./platform'); console.log('OS:',p.isWindows?'win':process.platform)"
      - name: Test adapter detection
        run: node -e "const a=require('./adapters'); console.log('Agent:',a.getAgent().name)"

  benchmark:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - name: Run benchmark suite
        run: node benchmarks/run_all.js
      - name: Run chaos test
        run: node benchmarks/chaos_test.js
